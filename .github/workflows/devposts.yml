name: Sync Endless Online Dev Posts

on:
  workflow_dispatch:
  schedule:
    # every 2 hours; tune as you like
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape & update news.json
        run: |
          python scripts/scrape_devposts.py

      - name: Commit & push if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "chore: sync Endless Online dev posts"
            git push
          else
            echo "No changes."
          fi
