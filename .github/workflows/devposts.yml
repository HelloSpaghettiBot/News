name: Sync Endless Online Dev Posts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 */2 * *"
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper (with logs)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/scrape_devposts.py
          echo "Diff after script (if any):"
          git diff -- news.json || true

      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit & push if changed
        run: |
          if ! git diff --quiet --exit-code news.json; then
            git add news.json
            git commit -m "chore: sync Endless Online dev posts"
            git push
          else
            echo "No changes."
          fi
